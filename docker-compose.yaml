services:
  postgres:
    image: postgres:17.9
    container_name: docs-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    command: [
      "-path", "/migrations",
      "-database", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
      "up"
    ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  nats:
    image: nats:latest
    container_name: docs-nats
    command: ["-js"]
    ports:
      - "4222:4222"   
    restart: unless-stopped
    
  api:
    build: .
    container_name: docs-api 
    depends_on: 
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - NATS_URL=nats://nats:4222
    ports:
      - "8080:8080"
    command: ["./api"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  worker:
    build: .
    container_name: docs-worker 
    depends_on: 
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - NATS_URL=nats://nats:4222
    command: ["./worker"]
    restart: unless-stopped
volumes:
  pgdata: