apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "worker"
        static_configs:
          - targets: ["worker-svc:9090"]

      - job_name: "api"
        static_configs:
          - targets: ["api-svc:8080"]
        metrics_path: /api/v1/metrics